<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masatz</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #111111;
      color: #f5f2ec;
      font-family: 'Special Elite', 'Courier New', monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 3rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: normal;
      letter-spacing: -0.01em;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .sottotitolo {
      font-size: 0.9em;
      color: #666;
      font-style: italic;
      text-align: center;
      margin-bottom: 4rem;
    }

    .lang-choice {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .lang-btn {
      font-family: 'Special Elite', monospace;
      font-size: 0.8em;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: #f5f2ec;
      border: 1px solid #333;
      padding: 1em 2.5em;
      transition: border-color 0.2s, color 0.2s;
      display: inline-block;
    }

    .lang-btn:hover {
      border-color: #f5f2ec;
    }

    .lang-btn .lang-name {
      display: block;
      font-size: 1.3em;
      margin-bottom: 0.3em;
      letter-spacing: 0.05em;
    }

    .lang-btn .lang-sub {
      display: block;
      font-size: 0.75em;
      color: #555;
      letter-spacing: 0.15em;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #333;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="label">Masatz — Aprile 2026</div>

  <h1>Non è un destino</h1>
  <p class="sottotitolo">Not by chance</p>

  <div class="lang-choice">
    <a href="it/index.html" class="lang-btn">
      <span class="lang-name">Italiano</span>
      <span class="lang-sub">Prima edizione</span>
    </a>
    <a href="en/index.html" class="lang-btn">
      <span class="lang-name">English</span>
      <span class="lang-sub">First edition</span>
    </a>
  </div>

  <footer>© Masatz 2026 — CC BY-NC-ND 4.0</footer>

</body>
</html>
